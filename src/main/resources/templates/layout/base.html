<!doctype html>
<html lang="en" xmlns:th="http://thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:fragment="header(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Reserva Canchas</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .minimal-footer {
      margin-top: 3rem;
      padding: 1.5rem 1rem;
      background: #f8f9fa;
      border-top: 1px solid #dee2e6;
      color: #6c757d;
      text-align: center;
    }

    .minimal-footer p {
      margin: 0 0 0.5rem;
    }

    .minimal-footer .footer-links a {
      color: #0d6efd;
      text-decoration: none;
    }

    .minimal-footer .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>


<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/}">Perales Sports</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
      </ul>
      <ul class="navbar-nav" sec:authorize="!isAuthenticated()">
        <li class="nav-item"><a class="nav-link" th:href="@{/login}">Login</a></li>
      </ul>
      <ul class="navbar-nav" sec:authorize="isAuthenticated()">
        <li class="nav-item">
          <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-link nav-link" style="text-decoration: none;">Logout</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- CORRECCIÓN CLAVE: El fragmento se declara limpio sin firmas conflictivas -->
<div class="container mt-4"  th:fragment="body(content)" >
  <div  th:replace="${content}"></div>
</div>



<footer class="minimal-footer" th:fragment="footer">
  <div class="footer-content">
    <p>&copy; <script>new Date().getFullYear()>2010&&document.write(""+new Date().getFullYear());</script> Designed & Developed by <strong>Facundo Sebastian Córdoba</strong></p>
    <div class="footer-links">
      <a href="mailto:cordobafs.dev@gmail.com">Contacto</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</html>
