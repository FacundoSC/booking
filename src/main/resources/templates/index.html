<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" >
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <div>
    <h1>Inmuebles Deportivos</h1>
    <div class="row">

      <div class="col-4" th:each="f: ${facilities}">
        <div class="card mb-3">
          <div class="card-body">
            <h5 class="card-title" th:text="${f.name}">Cancha</h5>
            <p class="card-text">Tipo: <span th:text="${f.type}">Tipo</span></p>
            <a class="btn btn-primary" th:href="@{/dashboard}">Reservar</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
