<!doctype html>
<html xmlns:th="http://thymeleaf.org" >
<head th:replace="~{layout/base :: header('index')}">
</head>
<body>
<!-- Inserta la barra de navegación común -->
<nav th:replace="~{layout/base :: nav}"></nav>

<!-- CORRECCIÓN CLAVE: Se invoca pasando la variable explícita 'content' -->
<div th:replace="~{layout/base :: body(content=~{::#main-content})}">
  <div id="main-content">
    <h1>Espacios Deportivos</h1>
    <div class="row">
      <div class="col-4" th:each="f: ${facilities}">
        <div class="card mb-3">
          <div class="card-body">
            <h5 class="card-title" th:text="${f.name}">Cancha</h5>
            <p class="card-text">Tipo: <span th:text="${f.type}">Tipo</span></p>
            <a class="btn btn-primary" th:href="@{/dashboard}">Reservar</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
